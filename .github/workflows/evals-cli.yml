name: Evals — CLI Agent

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/utils/**'
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/utils/**'

concurrency:
  group: evals-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: '1.3.6'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install fixture site dependencies
        working-directory: packages/cli/evals/fixture-site
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run CLI evals
        run: bun test packages/cli/evals/eval.test.ts --timeout 600000
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGCHAIN_TRACING_V2: 'true'
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
